services:
  postgres:
    image: postgres:16
    container_name: singlevendor_postgres
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - singlevendor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 1024m
    cpus: "1.0"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: singlevendor_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - singlevendor_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:80")''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

  redis:
    image: redis:7
    container_name: singlevendor_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

  thumbnail-worker:
    build: ../thumbnail-worker
    container_name: thumbnail_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILE_DIRECTORY=/c/Users/carlo/appfiles
    volumes:
      - /c/Users/carlo/appfiles:/c/Users/carlo/appfiles
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

volumes:
  postgres_data:

networks:
  singlevendor_network:
    driver: bridge
