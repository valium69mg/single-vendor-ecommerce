services:
  postgres:
    image: postgres:16
    container_name: singlevendor_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - singlevendor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: singlevendor_pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - singlevendor_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:80")''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

  backend:
    build:
      context: .
    image: single-vendor-ecommerce-backend:local
    container_name: singlevendor_backend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - singlevendor_network
    env_file:
      - .env
    volumes:
    - ${FILE_DIRECTORY}:${FILE_DIRECTORY} 
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s
    mem_limit: 728m
    cpus: "0.5"

  frontend:
    build:
      context: ../single-vendor-ecommerce-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_API_FILE_URL: ${VITE_API_FILE_URL:-http://localhost:8080/api/v1/file?key=}
    image: single-vendor-ecommerce-frontend:local
    container_name: singlevendor_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - singlevendor_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: "0.5"

volumes:
  postgres_data:

networks:
  singlevendor_network:
    driver: bridge
